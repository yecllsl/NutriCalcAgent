name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────
  # 单元 + 集成测试
  # 不安装 PaddleOCR / Playwright 浏览器，跑得最快
  # ──────────────────────────────────────────
  unit-tests:
    name: Unit & Integration (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v4

    - name: Cache uv
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('nutricalc-mcp/uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Install dependencies (no OCR, no browser)
      # 仅安装 dev 依赖；paddleocr/paddlepaddle 已在 pyproject.toml 拆到 optional[ocr]
      # 单元测试 OCR 用例通过 mock 验证，不会真正调用 paddle
      run: |
        cd nutricalc-mcp
        uv sync --extra dev

    - name: Run unit & integration tests
      run: |
        cd nutricalc-mcp
        uv run pytest tests/ -v --cov=src --cov-report=xml -m "not e2e"

    - name: Upload coverage
      if: matrix.python-version == '3.12' && always()
      uses: codecov/codecov-action@v4
      with:
        files: ./nutricalc-mcp/coverage.xml
        fail_ci_if_error: false
